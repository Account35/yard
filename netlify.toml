# Yard is deployed to Netlify as a static single-page app.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# Every path serves the app shell; the app's router handles the rest.
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
